# 推送 release 分支 / v* 标签 / 手动触发:
# Windows 上 PyInstaller 打 GoGauge.exe，并创建/更新 GitHub Release
name: Build & Release

on:
  push:
    branches:
      - release
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pyinstaller

      - name: Build GoGauge.exe
        # 与 build.bat 保持一致 (单文件 / 无控制台 / 裁剪误收集依赖)
        shell: cmd
        run: >
          pyinstaller --noconfirm --clean --onefile --noconsole --name GoGauge
          --add-data "app\web;app\web"
          --add-data "assets;assets"
          --icon assets\GoGauge.ico
          --collect-submodules webview
          --hidden-import clr
          --hidden-import pythonnet
          --hidden-import pystray
          --exclude-module numpy
          --exclude-module cryptography
          --exclude-module PIL._avif
          entry.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoGauge-windows
          path: dist/GoGauge.exe
          if-no-files-found: error

      - name: Resolve release tag
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            # release 分支 / 手动触发: 用 app.__version__ 生成 tag (如 v2.5.1)
            $v = python -c "from app import __version__; print(__version__)"
            if (-not $v) { throw "无法读取 app.__version__" }
            $tag = "v$v"
          }
          Write-Host "release tag = $tag"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub Release
        # tag 推送、release 分支推送、手动触发都会发版
        if: >-
          startsWith(github.ref, 'refs/tags/') ||
          github.ref == 'refs/heads/release' ||
          github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: dist/GoGauge.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
